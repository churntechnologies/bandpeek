[package]
name = "bandpeek"
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
default-run = "bandpeek"

[lib]
name = "bandpeek_core"

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:base64",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-web-kit",
    "dep:block2",
]
custom-protocol = ["tauri/custom-protocol"]
# Collector-only CLI for experiments; not part of the app bundle.
probe = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png", "unstable"] }
base64 = { version = "0.22", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
# Public AppKit only: app icons, menu-bar title and popup window styling.
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
# Validation-only WebView snapshots (already in the tree through wry).
objc2-web-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKWebView",
    "WKSnapshotConfiguration",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSString",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSError",
    "NSAttributedString",
    "NSDictionary",
    "NSData",
    "NSGeometry",
    "NSURL",
    "NSObject",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSAttributedString",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }

[[bin]]
name = "bandpeek"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "bandpeek-probe"
path = "src/bin/probe.rs"
required-features = ["probe"]
