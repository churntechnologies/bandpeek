name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Extend only after each additional architecture/platform is validated.
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    outputs:
      mode: ${{ steps.credentials.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Validate versions, identity and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/release_config.py --require-key --tag "$RELEASE_TAG"
          else
            python3 scripts/release_config.py --require-key
          fi
      - run: python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features probe,release-tools --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features release-tools
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare signing configuration (never print secrets)
        id: credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          UNNOTARIZED_BETA_APPROVED_TAG: ${{ vars.UNNOTARIZED_BETA_APPROVED_TAG }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          python3 scripts/release_config.py --require-key --overlay .validation/release-config.json \
            --approved-unnotarized-beta-tag "$UNNOTARIZED_BETA_APPROVED_TAG" \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"
      - name: Build Developer ID candidate (Tauri signs, notarizes and staples)
        if: steps.credentials.outputs.mode == 'developer-id'
        uses: tauri-apps/tauri-action@v1
        env:
          # No tag/release inputs here: this step cannot publish a release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }} --config .validation/release-config.json --bundles app,dmg
      - name: Build unnotarized candidate (approved beta or local validation)
        if: steps.credentials.outputs.mode == 'unnotarized-beta' || steps.credentials.outputs.mode == 'local-validation'
        uses: tauri-apps/tauri-action@v1
        env:
          # Apple variables must be absent: even empty values trigger certificate import.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --config .validation/release-config.json --bundles app,dmg
      - name: Verify trusted bundle
        if: steps.credentials.outputs.mode == 'developer-id'
        run: |
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BandPeek.app
          codesign --verify --deep --strict "$APP"
          codesign --display --verbose=4 "$APP" 2> .validation/codesign.txt
          python3 - <<'PY'
          from pathlib import Path
          evidence = Path('.validation/codesign.txt').read_text()
          assert 'Authority=Developer ID Application:' in evidence
          assert 'runtime' in evidence
          assert 'Identifier=io.github.churntechnologies.bandpeek' in evidence
          PY
          xcrun stapler validate "$APP"
          spctl --assess --type execute "$APP"
          xcrun stapler validate src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - name: Verify ad-hoc bundle
        if: steps.credentials.outputs.mode != 'developer-id'
        run: |
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BandPeek.app
          codesign --verify --deep --strict "$APP"
          codesign --display --verbose=4 "$APP" 2> .validation/codesign.txt
          python3 - <<'PY'
          from pathlib import Path
          evidence = Path('.validation/codesign.txt').read_text()
          assert 'Signature=adhoc' in evidence
          assert 'Authority=' not in evidence
          assert 'runtime' in evidence
          assert 'Identifier=io.github.churntechnologies.bandpeek' in evidence
          PY
      - name: Verify updater signature against the embedded public key
        run: >-
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features release-tools
          --bin bandpeek-verify-update -- src-tauri/tauri.conf.json
          src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BandPeek.app.tar.gz
          src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BandPeek.app.tar.gz.sig
      - name: Generate signed updater manifest
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_MODE: ${{ steps.credentials.outputs.mode }}
          UNNOTARIZED_BETA_APPROVED_TAG: ${{ vars.UNNOTARIZED_BETA_APPROVED_TAG }}
        run: >-
          python3 scripts/release_manifest.py src-tauri/target/aarch64-apple-darwin/release/bundle
          --tag "$RELEASE_TAG" --mode "$RELEASE_MODE" --output .validation/release-assets
          --approved-unnotarized-beta-tag "$UNNOTARIZED_BETA_APPROVED_TAG"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: ${{ steps.credentials.outputs.mode }}-apple-silicon-release
          path: .validation/release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: LOCAL-VALIDATION-ONLY-apple-silicon
          path: |
            .validation/release-assets/latest.json
            .validation/release-assets/SHA256SUMS
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    # The owner sets this exact tag only after every public-release gate passes.
    # Configure required reviewers on the public-release environment as well.
    if: >-
      github.ref_type == 'tag' && vars.PUBLIC_RELEASE_APPROVED_TAG == github.ref_name &&
      (needs.build.outputs.mode == 'developer-id' ||
       (needs.build.outputs.mode == 'unnotarized-beta' &&
        vars.UNNOTARIZED_BETA_APPROVED_TAG == github.ref_name))
    environment: public-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.mode }}-apple-silicon-release
          path: release-assets
      - name: Publish approved release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" *.dmg *.app.tar.gz *.app.tar.gz.sig latest.json SHA256SUMS \
            --verify-tag --title "BandPeek $RELEASE_TAG" --notes-file RELEASE_NOTES.md "${args[@]}"
