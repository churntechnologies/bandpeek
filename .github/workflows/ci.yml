name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # The only implemented collector is macOS; its tests use macOS process APIs.
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check and Vite build
        run: npm run build

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy (core)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features probe --all-targets -- -D warnings

      - name: Clippy (desktop)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests (core)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

      - name: Tests (desktop)
        run: cargo test --manifest-path src-tauri/Cargo.toml
